<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shadow DOM</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="card">
    <h1>Verify your device</h1>
    <p>The field lives inside a web component's shadow root.</p>
    <code-field></code-field>
  </main>
  <script>
    customElements.define('code-field', class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = '<style>input{width:100%;height:42px;border:1px solid #1115112e;border-radius:10px;padding:0 12px;font:inherit}</style>' +
          '<label for="c" style="display:block;margin-bottom:6px;font-size:13px">Device code</label><input id="c" autocomplete="one-time-code" inputmode="numeric">';
      }
    });
  </script>
</body>
</html>
