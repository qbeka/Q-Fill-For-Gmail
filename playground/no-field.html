<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Newsletter</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="card">
    <h1>Join the newsletter</h1>

  </main>

</html>
