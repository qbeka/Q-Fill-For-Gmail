name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Page where it happened
      description: The site or kind of form, if it is about filling. Leave out anything private.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131 on macOS 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Q-Fill version
      description: Shown at the bottom of the popup.
      placeholder: 2.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Any message in the popup, or errors from chrome://extensions, then Q-Fill, then "service worker".
      render: text
