<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q-Fill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell" aria-live="polite">
    <header class="top">
      <img class="mark" src="../icons/icon-48.png" alt="" width="24" height="24">
      <span class="name">Q-Fill</span>
      <span class="account" id="account"></span>
      <button class="icon-button" id="openSettings" type="button" hidden>
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"><path d="M3 6.5h8.5M15.5 6.5H17M3 13.5h1.5M8.5 13.5H17"/><circle cx="13.5" cy="6.5" r="2"/><circle cx="6.5" cy="13.5" r="2"/></svg>
        <span class="sr-only" data-i18n="settingsTitle">Settings</span>
      </button>
    </header>
    <svg class="line" viewBox="0 0 320 14" preserveAspectRatio="none" aria-hidden="true"><path d="M0 11 C 40 11, 52 4, 82 6 S 130 12, 160 8 S 214 2, 246 6 S 300 11, 320 9" fill="none" stroke="currentColor" stroke-width="1"/></svg>

    <!-- First run: bring your own OAuth client -->
    <section class="view" id="viewSetup" hidden>
      <h1 data-i18n="setupTitle">Set up Q-Fill</h1>
      <p class="lead" data-i18n="setupLead"></p>
      <ol class="steps">
        <li><span data-i18n="setupStep1"></span></li>
        <li>
          <span data-i18n="setupStep2"></span>
          <span class="copy-row">
            <code id="setupRedirect"></code>
            <button class="ghost small" type="button" data-copy="setupRedirect" data-i18n="copy">Copy</button>
          </span>
        </li>
        <li>
          <label for="clientIdInput" data-i18n="setupStep3"></label>
          <form class="client-form" id="clientForm" novalidate>
            <input id="clientIdInput" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-placeholder="clientIdPlaceholder">
            <button class="solid" type="submit" data-i18n="save">Save</button>
          </form>
          <p class="field-error" id="clientIdError" hidden data-i18n="clientIdInvalid"></p>
        </li>
      </ol>
      <button class="text-button" id="cancelClientEdit" type="button" hidden data-i18n="cancel">Cancel</button>
      <a class="text-link" id="setupGuide" target="_blank" rel="noopener" href="https://github.com/qbeka/Q-Fill-For-Gmail/blob/main/docs/setup.md" data-i18n="setupGuide">Step-by-step guide</a>
    </section>

    <!-- Client saved, not connected yet -->
    <section class="view" id="viewConnect" hidden>
      <h1 data-i18n="connectTitle">Connect Gmail</h1>
      <p class="lead" data-i18n="connectLead"></p>
      <button class="solid wide" id="connectButton" type="button" data-i18n="connectButton">Connect Gmail</button>
      <p class="hint" data-i18n="connectHint"></p>
      <p class="notice error" id="connectError" hidden></p>
    </section>

    <!-- Connected -->
    <section class="view" id="viewMain" hidden>
      <button class="solid wide big" id="fillButton" type="button">
        <span data-i18n="fillButton">Fill code</span>
        <kbd id="fillShortcut" hidden></kbd>
      </button>
      <p class="hint" id="fillHint" data-i18n="fillHint"></p>

      <div class="progress" id="progress" hidden>
        <span class="pulse" aria-hidden="true"></span>
        <div class="progress-text">
          <p class="progress-title" id="progressTitle"></p>
          <p class="progress-detail" id="progressDetail"></p>
        </div>
        <button class="ghost small" id="cancelButton" type="button" data-i18n="cancel">Cancel</button>
      </div>

      <div class="result" id="result" hidden>
        <div class="result-head">
          <span class="badge" id="resultBadge"></span>
          <span class="result-meta" id="resultMeta"></span>
        </div>
        <div class="code-row" id="codeRow">
          <output class="code" id="resultCode"></output>
          <button class="ghost small" type="button" id="copyCode" data-i18n="copy">Copy</button>
        </div>
        <p class="result-note" id="resultNote"></p>
      </div>
    </section>

    <!-- Settings -->
    <section class="view" id="viewSettings" hidden>
      <div class="settings-head">
        <button class="text-button" id="closeSettings" type="button">&larr; <span data-i18n="settingsBack">Back</span></button>
        <h1 data-i18n="settingsTitle">Settings</h1>
      </div>
      <dl class="rows">
        <div class="row">
          <dt data-i18n="settingsAccount">Gmail account</dt>
          <dd id="settingsEmail"></dd>
        </div>
        <div class="row">
          <dt><label for="lookbackSelect" data-i18n="settingsLookback">Look back</label></dt>
          <dd>
            <select id="lookbackSelect"></select>
            <span class="row-hint" data-i18n="settingsLookbackHint"></span>
          </dd>
        </div>
        <div class="row">
          <dt data-i18n="settingsShortcut">Keyboard shortcut</dt>
          <dd><kbd id="settingsShortcut"></kbd> <button class="text-button" id="changeShortcut" type="button" data-i18n="settingsShortcutChange">Change</button></dd>
        </div>
        <div class="row">
          <dt data-i18n="settingsClient">OAuth client</dt>
          <dd><code class="clip" id="settingsClientId"></code> <button class="text-button" id="changeClient" type="button" data-i18n="settingsChangeClient">Change client ID</button></dd>
        </div>
        <div class="row">
          <dt data-i18n="settingsRedirect">Redirect URI</dt>
          <dd class="copy-row"><code class="clip" id="settingsRedirect"></code> <button class="ghost small" type="button" data-copy="settingsRedirect" data-i18n="copy">Copy</button></dd>
        </div>
      </dl>
      <button class="ghost wide danger" id="disconnectButton" type="button" data-i18n="disconnect">Disconnect Gmail</button>
    </section>

    <footer class="foot">
      <span id="version"></span>
      <a target="_blank" rel="noopener" href="https://github.com/qbeka/Q-Fill-For-Gmail/blob/main/PRIVACY.md" data-i18n="privacyLink">Privacy</a>
      <a target="_blank" rel="noopener" href="https://github.com/qbeka/Q-Fill-For-Gmail" data-i18n="sourceLink">Source</a>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
